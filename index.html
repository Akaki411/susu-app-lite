<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
    <meta id="theme-color-meta" name="theme-color" content="#e7e8ec"/>
    <meta name="description" content="Расписание, рейтинг БРС, электронный пропуск и сервисы ЮУрГУ"/>

    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" href="/favicon.ico" sizes="any"/>
    <link rel="apple-touch-icon" href="/icon.png"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="ЮУрГУ Онлайн"/>
    <link rel="stylesheet" href="/src/styles/main.scss"/>

    <script>
        (() => {
            const THEME_BG = {light: '#e7e8ec', dark: '#131318'}
            let stored = 'system'
            try {
                const t = localStorage.getItem('susu_theme')
                if (t === 'dark' || t === 'light') {
                    stored = t
                    document.documentElement.setAttribute('data-theme', t)
                }
            } catch (e) {}
            try {
                const isDark =
                    stored === 'dark' ||
                    (stored === 'system' &&
                        window.matchMedia &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches)
                const meta = document.getElementById('theme-color-meta')
                if (meta) meta.setAttribute('content', isDark ? THEME_BG.dark : THEME_BG.light)
            } catch (e) {}
            try {
                const lang = JSON.parse(localStorage.getItem('susu_settings') || '{}').language
                if (typeof lang === 'string' && lang) {
                    document.documentElement.lang = lang
                    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
                }
            } catch (e) {}
        })()
    </script>

    <title>ЮУрГУ Онлайн</title>
</head>

<body>
    <div id="root"></div>
</body>

</html>
