<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
    <meta name="theme-color" content="#264795"/>
    <meta name="description" content="Расписание, рейтинг БРС, электронный пропуск и сервисы ЮУрГУ"/>

    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" href="/favicon.ico" sizes="any"/>
    <link rel="apple-touch-icon" href="/icon.png"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="ЮУрГУ Онлайн"/>
    <link rel="stylesheet" href="/src/styles/main.scss"/>

    <script>
        (() => {
            try {
                const t = localStorage.getItem('susu_theme')
                if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
            } catch (e) {}
            try {
                const lang = JSON.parse(localStorage.getItem('susu_settings') || '{}').language
                if (typeof lang === 'string' && lang) {
                    document.documentElement.lang = lang
                    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
                }
            } catch (e) {}
        })()
    </script>

    <title>ЮУрГУ Онлайн</title>
</head>

<body>
    <div id="root"></div>
</body>

</html>
